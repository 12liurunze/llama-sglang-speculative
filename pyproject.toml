[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-sglang-speculative-bench"
version = "0.1.0"
description = "Single-node tensor-parallel Chain / original Adaptive2 benchmark"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["llama_speculative*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

